services:
  inventory:
    build: ./services/inventory
    environment:
      APP_VERSION: "1.0.0"
      BUGGY: "${BUGGY:-false}"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  orders:
    build: ./services/orders
    environment:
      APP_VERSION: "1.0.0"
      INVENTORY_URL: "http://inventory:8000"
    ports:
      - "8002:8000"
    depends_on:
      inventory:
        condition: service_healthy
