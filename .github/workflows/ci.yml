name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, orders]
        python: ["3.12", "3.14"]   # 3.12 = Docker image, 3.14 = local dev
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker-build:
    name: docker build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory, orders]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t opspilot/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Smoke test container
        run: |
          docker run -d --name svc -p 8000:8000 opspilot/${{ matrix.service }}:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs svc
          exit 1
