name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.service }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, orders]
        python: ["3.12", "3.14"]   # 3.12 = Docker image, 3.14 = local dev
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker-build:
    name: docker build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory, orders]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t opspilot/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Smoke test container
        run: |
          docker run -d --name svc -p 8000:8000 opspilot/${{ matrix.service }}:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs svc
          exit 1

  k8s-validate:
    name: validate helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Install kubeconform (checksum verified)
        env:
          V: "0.8.0"
          SHA: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v$V/kubeconform-linux-amd64.tar.gz"
          echo "$SHA  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform

      - name: Lint and validate every environment
        env:
          CHART: deploy/helm/opspilot-app
        run: |
          for env in default staging prod; do
            args=()
            [ "$env" != default ] && args=(-f "$CHART/values-$env.yaml")
            echo "::group::$env"
            helm lint --strict "$CHART" "${args[@]}"
            helm template opspilot "$CHART" -n opspilot "${args[@]}" \
              | ./kubeconform -strict -summary -kubernetes-version 1.37.0 -
            echo "::endgroup::"
          done

      - name: Validate Argo CD manifests
        run: |
          ./kubeconform -strict -summary -kubernetes-version 1.37.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/argocd/

  e2e-kind:
    name: e2e on kind
    needs: [test, k8s-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Install kind (checksum verified)
        env:
          V: "0.33.0"
          SHA: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
        run: |
          curl -sSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/v$V/kind-linux-amd64"
          echo "$SHA  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Create cluster, deploy, smoke test
        run: bash scripts/cluster-up.sh

      - name: Debug on failure
        if: failure()
        run: |
          helm --kube-context kind-opspilot -n opspilot status opspilot || true
          kubectl --context kind-opspilot -n opspilot get all,events
          kubectl --context kind-opspilot -n opspilot logs -l app.kubernetes.io/part-of=opspilot --tail=50 --prefix
