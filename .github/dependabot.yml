version: 2
updates:
  - package-ecosystem: pip
    directories: ["/services/inventory", "/services/orders"]
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/services/inventory", "/services/orders"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
