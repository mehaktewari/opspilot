# Local Kubernetes cluster for OpsPilot (kind = Kubernetes in Docker)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: opspilot
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # NodePort services -> localhost (9001/9002 so they don't clash with docker compose)
      - containerPort: 30001
        hostPort: 9001
        listenAddress: "127.0.0.1"
      - containerPort: 30002
        hostPort: 9002
        listenAddress: "127.0.0.1"
