# Staging: one replica each, internal-only, images from GitHub Container Registry
image:
  prefix: ghcr.io/mehaktewari/opspilot-
  tag: main           # CI will pin this to a commit SHA once images are published
  pullPolicy: Always

replicas: 1

service:
  type: ClusterIP

services:
  inventory:
    nodePort: null
  orders:
    nodePort: null
