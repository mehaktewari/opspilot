# Defaults = local development on kind (bash scripts/cluster-up.sh)
# Override per environment with values-staging.yaml / values-prod.yaml

image:
  # Final image = <prefix><service name>:<tag>, e.g. opspilot/inventory:dev
  prefix: opspilot/
  tag: dev
  pullPolicy: IfNotPresent

# Default replicas per service (a service can override with its own `replicas`)
replicas: 2

service:
  type: NodePort      # kind maps NodePorts 30001/30002 to localhost:9001/9002
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi

podDisruptionBudget:
  enabled: true       # only rendered for services with more than 1 replica
  minAvailable: 1

services:
  inventory:
    enabled: true
    nodePort: 30001
    env:
      BUGGY: "false"  # set "true" to simulate a bad release
  orders:
    enabled: true
    replicas: 1
    nodePort: 30002
    env:
      INVENTORY_URL: "http://inventory:8000"
