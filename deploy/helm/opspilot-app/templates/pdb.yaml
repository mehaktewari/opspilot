{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $replicas := int ($svc.replicas | default $.Values.replicas) }}
{{- if and $svc.enabled (gt $replicas 1) }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
# Keeps at least minAvailable pods running during node drains and cluster upgrades
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "opspilot.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "opspilot.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
