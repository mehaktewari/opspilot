# Monitoring, deployed the GitOps way: upstream Helm charts + our values files from this repo.
# Each Application has two sources: the chart, and this repo (ref "values") for the values file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: opspilot
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 31.0.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/deploy/monitoring/prometheus-values.yaml
    - repoURL: https://github.com/mehaktewari/opspilot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: opspilot
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.6.1
      helm:
        releaseName: grafana
        valueFiles:
          - $values/deploy/monitoring/grafana-values.yaml
    - repoURL: https://github.com/mehaktewari/opspilot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
